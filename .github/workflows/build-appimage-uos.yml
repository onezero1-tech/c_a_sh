name: Build c_a_sh AppImage for UOS 10 (glibc 2.28)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-appimage:
    runs-on: ubuntu-24.04

    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
      options: --user root

    env:
      # 全局 Git 配置，避免 dubious ownership 错误
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: "*"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install system dependencies
        run: |
          # 启用 PowerTools 仓库以获取 appindicator 和 keybinder
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled powertools

          dnf install -y \
            curl wget git unzip xz \
            clang cmake ninja-build pkg-config \
            gtk3-devel \
            libappindicator-gtk3-devel \
            keybinder3-devel \
            fuse-libs \
            python3-pip \
            file \
            binutils

      - name: Create dpkg and apt-get shims
        run: |
          # dpkg shim: 让 setup.dart 认为所有 Debian 包已安装
          cat > /usr/local/bin/dpkg << 'EOF'
          #!/bin/sh
          case "$1" in
            -s|--status)
              echo "Package: $2"
              echo "Status: install ok installed"
              exit 0
              ;;
            -l|--list)
              echo "ii  $2  installed"
              exit 0
              ;;
            *)
              exit 0
              ;;
          esac
          EOF
          chmod +x /usr/local/bin/dpkg

          # apt-get shim: 防止 setup.dart 尝试调用 apt-get
          cat > /usr/local/bin/apt-get << 'EOF'
          #!/bin/sh
          exit 0
          EOF
          chmod +x /usr/local/bin/apt-get

      - name: Install Flutter
        run: |
          FLUTTER_VERSION=3.47.1
          wget -q "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          tar xf "flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" -C /opt
          rm -f "flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "/opt/flutter/bin" >> $GITHUB_PATH
          export PATH="/opt/flutter/bin:$PATH"
          flutter --version

      - name: Install Go
        run: |
          GO_VERSION=1.26.4
          wget -q "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          tar -C /usr/local -xzf "go${GO_VERSION}.linux-amd64.tar.gz"
          rm -f "go${GO_VERSION}.linux-amd64.tar.gz"
          echo "/usr/local/go/bin" >> $GITHUB_PATH
          export PATH="/usr/local/go/bin:$PATH"
          go version

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain

      - name: Install flutter_distributor
        run: |
          dart pub global activate --source git https://github.com/chen08209/flutter_distributor.git --git-ref v0.6.11-flclash.2 --git-path packages/flutter_distributor
          export PATH="$PATH:$HOME/.pub-cache/bin"
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          flutter_distributor --version

      - name: Patch wifi_ssid plugin for older GLib
        run: |
          # 先生成插件符号链接
          flutter pub get

          # 找到实际插件源文件并打补丁
          PLUGIN_LINK="linux/flutter/ephemeral/.plugin_symlinks/wifi_ssid/linux/wifi_ssid_plugin.cc"
          if [ -L "$PLUGIN_LINK" ] || [ -f "$PLUGIN_LINK" ]; then
            REAL_PLUGIN=$(readlink -f "$PLUGIN_LINK")
            echo "Patching real plugin file: $REAL_PLUGIN"
            sed -i 's/g_spawn_check_wait_status/g_spawn_check_exit_status/g' "$REAL_PLUGIN"
            sed -i 's/return g_variant_new_string(/return (GVariant *)g_variant_new_string(/g' "$REAL_PLUGIN"
            sed -i 's/return g_variant_new_boolean(/return (GVariant *)g_variant_new_boolean(/g' "$REAL_PLUGIN"
            sed -i 's/return g_variant_new_int32(/return (GVariant *)g_variant_new_int32(/g' "$REAL_PLUGIN"
            sed -i 's/return g_variant_new_uint32(/return (GVariant *)g_variant_new_uint32(/g' "$REAL_PLUGIN"
            sed -i 's/return g_strdup(/return (gchar *)g_strdup(/g' "$REAL_PLUGIN"
            sed -i 's/return g_variant_dup_string(/return (gchar *)g_variant_dup_string(/g' "$REAL_PLUGIN"
            echo "Patch applied successfully."
          else
            echo "ERROR: Plugin file not found at $PLUGIN_LINK"
            find . -name "wifi_ssid_plugin.cc" 2>/dev/null
            exit 1
          fi

      - name: Build c_a_sh AppImage
        run: |
          git config --global --add safe.directory '*'
          dart setup.dart linux --targets appimage

      - name: Verify GLIBC compatibility (ABI gate)
        run: |
          APPIMAGE=$(find build -name "*.AppImage" -type f | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "ERROR: No AppImage found"
            exit 1
          fi
          echo "Found: $APPIMAGE"
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract > /dev/null 2>&1 || true

          MAX_GLIBC="2.28"
          FAILED=0
          echo "Scanning ELF files for GLIBC symbols newer than ${MAX_GLIBC}..."

          # 收集所有 ELF 文件
          find squashfs-root -type f -exec file {} \; | grep 'ELF' | cut -d: -f1 > /tmp/elf_files.txt

          while read -r elf; do
            # 提取该 ELF 文件引用的所有 GLIBC 版本
            readelf --version-info "$elf" 2>/dev/null | grep -oP 'GLIBC_\K[0-9.]+' | sort -uV > /tmp/glibc_vers.txt
            while read -r ver; do
              if [ "$(printf '%s\n' "$MAX_GLIBC" "$ver" | sort -V | tail -n 1)" != "$MAX_GLIBC" ]; then
                echo "VIOLATION: $elf requires GLIBC_${ver}"
                FAILED=1
              fi
            done < /tmp/glibc_vers.txt
          done < /tmp/elf_files.txt

          if [ "$FAILED" -eq 1 ]; then
            echo "ABI gate failed: AppImage references GLIBC symbols newer than ${MAX_GLIBC}"
            exit 1
          fi
          echo "ABI gate passed: all GLIBC references <= ${MAX_GLIBC}"
          rm -rf squashfs-root

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: c_a_sh-AppImage-UOS10
          path: build/**/*.AppImage
          if-no-files-found: error
