name: Build c_a_sh AppImage for UOS 10 (glibc 2.28)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-appimage:
    runs-on: ubuntu-24.04

    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
      options: --user root

    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: "*"
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install system dependencies
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled powertools

          dnf install -y \
            curl wget git unzip xz \
            clang cmake ninja-build pkg-config \
            gtk3-devel \
            libappindicator-gtk3-devel \
            keybinder3-devel \
            fuse-libs \
            python3-pip \
            file \
            binutils

      - name: Create dpkg and apt-get shims
        run: |
          cat > /usr/local/bin/dpkg << 'EOF'
          #!/bin/sh
          case "$1" in
            -s|--status)
              echo "Package: $2"
              echo "Status: install ok installed"
              exit 0
              ;;
            -l|--list)
              echo "ii  $2  installed"
              exit 0
              ;;
            *)
              exit 0
              ;;
          esac
          EOF
          chmod +x /usr/local/bin/dpkg

          cat > /usr/local/bin/apt-get << 'EOF'
          #!/bin/sh
          exit 0
          EOF
          chmod +x /usr/local/bin/apt-get

      - name: Install Flutter
        run: |
          FLUTTER_VERSION=3.47.1
          wget -q "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          tar xf "flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" -C /opt
          rm -f "flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "/opt/flutter/bin" >> $GITHUB_PATH
          export PATH="/opt/flutter/bin:$PATH"
          flutter --version

      - name: Install Go
        run: |
          GO_VERSION=1.26.4
          wget -q "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          tar -C /usr/local -xzf "go${GO_VERSION}.linux-amd64.tar.gz"
          rm -f "go${GO_VERSION}.linux-amd64.tar.gz"
          echo "/usr/local/go/bin" >> $GITHUB_PATH
          export PATH="/usr/local/go/bin:$PATH"
          go version

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain

      - name: Build sqlite3 for glibc 2.28
        run: |
          set -e
          SQLITE_VERSION="3530400"
          wget -q "https://www.sqlite.org/2026/sqlite-autoconf-${SQLITE_VERSION}.tar.gz"
          tar xf "sqlite-autoconf-${SQLITE_VERSION}.tar.gz"
          cd "sqlite-autoconf-${SQLITE_VERSION}"

          # 在 glibc 2.28 容器内编译，产物天然兼容 UOS 10
          ./configure --enable-all --prefix=/usr/local
          make -j$(nproc)
          make install
          strip --strip-unneeded /usr/local/lib/libsqlite3.so.0* 2>/dev/null || true
          strip --strip-unneeded /usr/local/lib/libsqlite3.so 2>/dev/null || true          

          NEW_LIB="/usr/local/lib/libsqlite3.so"
          if [ ! -f "$NEW_LIB" ]; then
            echo "ERROR: Newly built libsqlite3.so not found at $NEW_LIB"
            exit 1
          fi
          echo "New libsqlite3.so built successfully."
          echo "Max GLIBC symbol referenced by new lib:"
          readelf --version-info "$NEW_LIB" | grep -oP 'GLIBC_\K[0-9.]+' | sort -uV | tail -1

          cd ..
          rm -rf "sqlite-autoconf-${SQLITE_VERSION}" "sqlite-autoconf-${SQLITE_VERSION}.tar.gz"
          echo "SQLite build step completed."

      - name: Install flutter_distributor
        run: |
          dart pub global activate --source git https://github.com/chen08209/flutter_distributor.git --git-ref v0.6.11-flclash.2 --git-path packages/flutter_distributor
          export PATH="$PATH:$HOME/.pub-cache/bin"
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          flutter_distributor --version

      - name: Patch wifi_ssid plugin and CMake flags
        run: |
          set -e
          git config --global --add safe.directory '*'

          # 生成 .plugin_symlinks 目录
          flutter pub get

          PLUGIN_LINK="linux/flutter/ephemeral/.plugin_symlinks/wifi_ssid/linux/wifi_ssid_plugin.cc"
          if [ ! -f "$PLUGIN_LINK" ]; then
            echo "ERROR: Plugin not found at $PLUGIN_LINK"
            find . -name "wifi_ssid_plugin.cc" 2>/dev/null
            exit 1
          fi
          REAL_PLUGIN=$(readlink -f "$PLUGIN_LINK")
          echo "Patching source: $REAL_PLUGIN"

          # 1) 替换新版 GLib API 为旧版名称
          sed -i 's/g_spawn_check_wait_status/g_spawn_check_exit_status/g' "$REAL_PLUGIN"

          # 2) 在第 57、353 行的 return 后插入显式类型转换
          echo "=== Before ==="
          sed -n '57p;353p' "$REAL_PLUGIN"

          sed -i '57s/^\(\s*return\s\+\)/\1(GVariant *)/' "$REAL_PLUGIN"
          sed -i '353s/^\(\s*return\s\+\)/\1(gchar *)/' "$REAL_PLUGIN"

          echo "=== After ==="
          sed -n '57p;353p' "$REAL_PLUGIN"

          # 3) 移除主 CMakeLists.txt 里的 -Werror，让 -fpermissive 生效
          if [ -f linux/CMakeLists.txt ]; then
            cp linux/CMakeLists.txt linux/CMakeLists.txt.bak
            sed -i 's/-Werror//g' linux/CMakeLists.txt

            if ! grep -q 'fpermissive' linux/CMakeLists.txt; then
              sed -i '/^cmake_minimum_required/a add_compile_options(-fpermissive)' linux/CMakeLists.txt
            fi

            echo "=== linux/CMakeLists.txt (first 20 lines) ==="
            head -20 linux/CMakeLists.txt
          fi
          
          # 4) 禁用 Impeller，避免在 UOS 10 上因 GPU 驱动兼容性问题导致段错误
          MY_APP_CC="linux/runner/my_application.cc"
          if [ -f "$MY_APP_CC" ]; then
            if ! grep -q 'fl_dart_project_set_enable_impeller' "$MY_APP_CC"; then
              # 在 fl_dart_project_new() 之后插入禁用 Impeller 的代码
              sed -i '/g_autoptr(FlDartProject) project = fl_dart_project_new();/a\  fl_dart_project_set_enable_impeller(project, FALSE);' "$MY_APP_CC"
              echo "Added Impeller disable in $MY_APP_CC"
            fi
          else
            echo "WARNING: $MY_APP_CC not found, skipping Impeller disable"
          fi          

      - name: Build c_a_sh AppImage
        env:
          FLUTTER_ENGINE_SWITCHES: "1"
          FLUTTER_ENGINE_SWITCH_1: "enable-impeller=false"
        run: |
          git config --global --add safe.directory '*'
          dart setup.dart linux --targets appimage

      - name: Replace libsqlite3.so in AppImage and repack
        run: |
          set -e
          APPIMAGE=$(find dist -name "*.AppImage" -type f | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "ERROR: No AppImage found for repack"
            ls -la dist/ 2>/dev/null || true
            exit 1
          fi
          echo "Repacking: $APPIMAGE"

          # 解压 AppImage
          rm -rf squashfs-root
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract > /dev/null 2>&1

          if [ ! -d squashfs-root ]; then
            echo "ERROR: Failed to extract AppImage"
            exit 1
          fi

          # 用 glibc 2.28 下编译的版本替换 AppImage 内的 libsqlite3.so
          NEW_LIB="/usr/local/lib/libsqlite3.so"
          FOUND=0
          find squashfs-root -name "libsqlite3.so*" -type f 2>/dev/null > /tmp/sqlite_files.txt
          echo "=== SQLite files found in AppImage ==="
          cat /tmp/sqlite_files.txt

          while read -r OLD_LIB; do
            [ -z "$OLD_LIB" ] && continue
            echo "Replacing: $OLD_LIB"
            ls -la "$OLD_LIB"
            
            if [ -L "$OLD_LIB" ]; then
              REAL_TARGET=$(readlink -f "$OLD_LIB")
              echo "  symlink -> $REAL_TARGET"
              cp -f "$NEW_LIB" "$REAL_TARGET"
            else
              cp -f "$NEW_LIB" "$OLD_LIB"
            fi
            ls -la "$OLD_LIB"
            FOUND=1
          done < /tmp/sqlite_files.txt

          if [ "$FOUND" -eq 0 ]; then
            echo "WARNING: No libsqlite3.so found inside AppImage"
            find squashfs-root -name "*.so*" | grep -i sqlite || true
          fi

          # 重新打包 AppImage（用 appimagetool，通过 APPIMAGE_EXTRACT_AND_RUN 绕过 FUSE）
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool --no-appstream squashfs-root "$APPIMAGE"
          echo "Repack done: $APPIMAGE"

          rm -rf squashfs-root

      - name: Verify GLIBC compatibility (ABI gate)
        run: |
          APPIMAGE=$(find dist build -name "*.AppImage" -type f 2>/dev/null | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "ERROR: No AppImage found"
            echo "Listing dist/ and build/ for debugging:"
            ls -la dist/ 2>/dev/null || true
            ls -la build/ 2>/dev/null || true
            exit 1
          fi
          echo "Found: $APPIMAGE"
          chmod +x "$APPIMAGE"

          # 解压 AppImage
          rm -rf squashfs-root
          "$APPIMAGE" --appimage-extract > /dev/null 2>&1 || true

          if [ ! -d squashfs-root ]; then
            echo "ERROR: Failed to extract AppImage"
            exit 1
          fi

          MAX_GLIBC="2.28"
          FAILED=0
          echo "Scanning ELF files for GLIBC symbols newer than ${MAX_GLIBC}..."

          find squashfs-root -type f -exec file {} \; | grep 'ELF' | cut -d: -f1 > /tmp/elf_files.txt
          echo "ELF file count: $(wc -l < /tmp/elf_files.txt)"

          # while read 不接管道，避免子 shell 变量丢失
          while read -r elf; do
            [ -z "$elf" ] && continue
            readelf --version-info "$elf" 2>/dev/null | grep -oP 'GLIBC_\K[0-9.]+' | sort -uV > /tmp/glibc_vers.txt
            while read -r ver; do
              [ -z "$ver" ] && continue
              if [ "$(printf '%s\n' "$MAX_GLIBC" "$ver" | sort -V | tail -n 1)" != "$MAX_GLIBC" ]; then
                echo "VIOLATION: $elf requires GLIBC_${ver}"
                FAILED=1
              fi
            done < /tmp/glibc_vers.txt
          done < /tmp/elf_files.txt

          if [ "$FAILED" -eq 1 ]; then
            echo "ABI gate failed: AppImage references GLIBC symbols newer than ${MAX_GLIBC}"
            exit 1
          fi
          echo "ABI gate passed: all GLIBC references <= ${MAX_GLIBC}"
          rm -rf squashfs-root

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: c_a_sh-AppImage-UOS10
          path: |
            dist/**/*.AppImage
            build/**/*.AppImage
          if-no-files-found: error
